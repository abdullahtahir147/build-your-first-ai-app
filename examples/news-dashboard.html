<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Feed — Personalised News Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #faf9f6;
            --surface: #ffffff;
            --border: #e8e5df;
            --text: #1a1a1a;
            --muted: #8a8580;
            --accent: #c0392b;
            --accent-dim: #c0392b10;
            --tag-bg: #f0ede8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            border-bottom: 2px solid var(--text);
            padding: 1.25rem 1.5rem 0.75rem;
            margin-bottom: 1.5rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        h1 {
            font-family: 'Newsreader', serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .date-display {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .edition-line {
            font-family: 'Newsreader', serif;
            font-style: italic;
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }

        .app { max-width: 750px; margin: 0 auto; padding: 0 1.5rem 2rem; }

        .setup-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .setup-title {
            font-family: 'Newsreader', serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .topic-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .topic-chip {
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;
            color: var(--muted);
        }

        .topic-chip:hover { border-color: var(--accent); color: var(--text); }
        .topic-chip.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .custom-topic-row {
            display: flex;
            gap: 0.5rem;
        }

        .custom-input {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            background: var(--bg);
        }

        .custom-input:focus { border-color: var(--accent); }

        .small-btn {
            padding: 0.5rem 1rem;
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .small-btn:hover { opacity: 0.85; }

        .generate-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: opacity 0.15s;
        }

        .generate-btn:hover { opacity: 0.85; }
        .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }

        .section-header {
            font-family: 'Newsreader', serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .article-list { display: flex; flex-direction: column; gap: 0; }

        .article {
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
            animation: appear 0.3s ease-out;
        }

        .article:last-child { border-bottom: none; }

        @keyframes appear {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .article-topic {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .article-headline {
            font-family: 'Newsreader', serif;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.4rem;
            cursor: pointer;
        }

        .article-headline:hover { color: var(--accent); }

        .article-summary {
            font-size: 0.9rem;
            line-height: 1.55;
            color: #444;
            margin-bottom: 0.5rem;
        }

        .article-meta {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .article-source {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
        }

        .article-time {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .save-btn {
            font-size: 0.75rem;
            color: var(--muted);
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .save-btn:hover { color: var(--accent); }
        .save-btn.saved { color: var(--accent); }

        .saved-section { margin-top: 2rem; }

        .saved-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
        }

        .saved-title {
            font-family: 'Newsreader', serif;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.8rem;
        }

        .remove-btn:hover { color: var(--accent); }

        .empty-msg {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
            font-style: italic;
        }

        .workshop-badge {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
            color: #ccc;
            font-size: 0.7rem;
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.5rem; }
            .article-headline { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="max-width: 750px; margin: 0 auto;">
            <div class="header-top">
                <h1>My Feed</h1>
                <span class="date-display" id="dateDisplay"></span>
            </div>
            <p class="edition-line">Your personalised morning briefing</p>
        </div>
    </div>

    <div class="app">
        <div class="setup-section">
            <div class="setup-title">What do you care about?</div>
            <div class="topic-grid" id="topicGrid"></div>
            <div class="custom-topic-row">
                <input class="custom-input" id="customTopic" placeholder="Add your own topic...">
                <button class="small-btn" onclick="addCustomTopic()">Add</button>
            </div>
            <button class="generate-btn" id="generateBtn" onclick="generateFeed()">
                Generate My Feed
            </button>
        </div>

        <div id="feedContainer"></div>

        <div class="saved-section" id="savedSection" style="display: none;">
            <div class="section-header">Saved Articles</div>
            <div id="savedList"></div>
        </div>

        <div class="workshop-badge">
            Built at Build Your First AI App — Kennington
        </div>
    </div>

    <script>
        const defaultTopics = [
            'Technology', 'AI & Machine Learning', 'Startups', 'Finance',
            'Climate', 'Science', 'UK Politics', 'World News',
            'Health', 'Sport', 'Culture', 'Space',
            'Crypto', 'Gaming', 'Music', 'Food'
        ];

        let selectedTopics = JSON.parse(localStorage.getItem('myfeed_topics') || '[]');
        let customTopics = JSON.parse(localStorage.getItem('myfeed_custom') || '[]');
        let savedArticles = JSON.parse(localStorage.getItem('myfeed_saved') || '[]');
        let generatedArticles = JSON.parse(localStorage.getItem('myfeed_articles') || '[]');

        // Set date
        const now = new Date();
        document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-GB', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });

        function saveState() {
            localStorage.setItem('myfeed_topics', JSON.stringify(selectedTopics));
            localStorage.setItem('myfeed_custom', JSON.stringify(customTopics));
            localStorage.setItem('myfeed_saved', JSON.stringify(savedArticles));
            localStorage.setItem('myfeed_articles', JSON.stringify(generatedArticles));
        }

        function renderTopics() {
            const grid = document.getElementById('topicGrid');
            const all = [...defaultTopics, ...customTopics];
            grid.innerHTML = all.map(topic => `
                <div class="topic-chip ${selectedTopics.includes(topic) ? 'active' : ''}"
                    onclick="toggleTopic('${topic.replace(/'/g, "\\'")}')">${topic}</div>
            `).join('');
        }

        function toggleTopic(topic) {
            if (selectedTopics.includes(topic)) {
                selectedTopics = selectedTopics.filter(t => t !== topic);
            } else {
                selectedTopics.push(topic);
            }
            saveState();
            renderTopics();
        }

        function addCustomTopic() {
            const input = document.getElementById('customTopic');
            const topic = input.value.trim();
            if (topic && !defaultTopics.includes(topic) && !customTopics.includes(topic)) {
                customTopics.push(topic);
                selectedTopics.push(topic);
                saveState();
                renderTopics();
            }
            input.value = '';
        }

        document.getElementById('customTopic').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addCustomTopic();
        });

        // Simulated article generation — in a real app this would call a news API
        const articleTemplates = {
            'Technology': [
                { h: 'New Open-Source Framework Challenges Big Tech\'s AI Dominance', s: 'A coalition of independent developers has released a framework that matches leading proprietary models at a fraction of the cost, raising questions about the future of paid AI services.', src: 'TechCrunch' },
                { h: 'Browser Wars Heat Up as Privacy-First Options Gain Market Share', s: 'New usage data shows privacy-focused browsers have captured over 15% of the European market, putting pressure on established players to rethink their data strategies.', src: 'The Verge' },
                { h: 'The Return of the Personal Website: Why Developers Are Leaving Social Media', s: 'An emerging trend sees tech professionals building their own corners of the internet, driven by platform instability and a desire for digital ownership.', src: 'Wired' }
            ],
            'AI & Machine Learning': [
                { h: 'Small Language Models Prove You Don\'t Need a Data Centre', s: 'Researchers demonstrate that models running on consumer hardware can outperform cloud-based giants on specialised tasks, democratising access to AI capabilities.', src: 'MIT Technology Review' },
                { h: 'AI Coding Assistants Are Changing How Beginners Learn to Program', s: 'Educators report a fundamental shift in computer science pedagogy as students arrive already fluent in prompting but unfamiliar with traditional debugging.', src: 'Nature' },
                { h: 'The Hidden Cost of AI: Water Usage at Data Centres Draws Scrutiny', s: 'New research reveals that training a single large language model can consume as much water as a small town uses in a month, prompting calls for sustainability standards.', src: 'The Guardian' }
            ],
            'Startups': [
                { h: 'London\'s Pre-Seed Scene Is Quietly Booming Despite Funding Headlines', s: 'While late-stage valuations grab attention, a record number of sub-£500K rounds closed in Q1, suggesting a healthy pipeline of new ventures.', src: 'Sifted' },
                { h: 'The Solo Founder Is Back: One-Person Startups Hit New Revenue Records', s: 'Enabled by AI tools and no-code platforms, individual founders are building profitable companies that would have required teams of ten just three years ago.', src: 'The Information' },
                { h: 'Why More Founders Are Choosing Bootstrapping Over VC Money', s: 'A growing cohort of startup founders is rejecting venture capital in favour of customer-funded growth, citing control and long-term sustainability.', src: 'Financial Times' }
            ],
            'Finance': [
                { h: 'Interest Rate Decisions Loom as Central Banks Weigh Stubborn Inflation', s: 'Markets brace for potential divergence between the Bank of England and Federal Reserve approaches to monetary policy this quarter.', src: 'Financial Times' },
                { h: 'Open Banking\'s Second Act: What the New Regulations Mean for Consumers', s: 'Updated financial data-sharing rules promise to give consumers more control over their money, but adoption hurdles remain.', src: 'Bloomberg' },
                { h: 'The Rise of the Micro-Investor: How Apps Are Changing Savings Habits', s: 'Platforms enabling fractional investing from as little as £1 are attracting a demographic that traditional finance has long ignored.', src: 'The Economist' }
            ],
            'Climate': [
                { h: 'Urban Rewilding Projects Show Measurable Impact on City Temperatures', s: 'Data from sensor networks in European cities reveals that strategic green corridors can reduce local temperatures by up to 4°C during heatwaves.', src: 'BBC News' },
                { h: 'New Battery Chemistry Could Make Grid Storage Affordable Within Five Years', s: 'A sodium-based alternative to lithium-ion technology promises cheaper energy storage, potentially accelerating the transition from fossil fuels.', src: 'New Scientist' }
            ],
            'Science': [
                { h: 'Deep Ocean Discovery Reveals New Understanding of Earth\'s Carbon Cycle', s: 'Expedition finds previously unknown microbial communities that play a significant role in sequestering carbon, challenging existing climate models.', src: 'Nature' },
                { h: 'Gene Therapy Breakthrough Offers Hope for Rare Childhood Diseases', s: 'Clinical trials show sustained improvement in patients with inherited metabolic disorders, marking a potential turning point in paediatric medicine.', src: 'The Lancet' }
            ],
            'UK Politics': [
                { h: 'Devolution Debate Intensifies as Regional Mayors Push for Greater Powers', s: 'A coalition of metro mayors has presented a unified case for expanded fiscal autonomy, arguing that centralised decision-making is holding back local economies.', src: 'The Guardian' },
                { h: 'Housing Bill Amendments Draw Cross-Party Support and Opposition', s: 'The latest revisions to the planning reform legislation have created unusual political alliances, with backbenchers on both sides breaking from party lines.', src: 'BBC News' }
            ],
            'World News': [
                { h: 'Pacific Trade Agreement Reshapes Global Supply Chain Dynamics', s: 'The newly signed agreement between twelve nations is expected to redirect billions in trade flows, with significant implications for European manufacturers.', src: 'Reuters' },
                { h: 'Humanitarian Corridor Negotiations Show Progress in Conflict Zone', s: 'Mediators report cautious optimism as warring parties agree to temporary measures allowing aid delivery to affected civilian populations.', src: 'Al Jazeera' }
            ],
            'Health': [
                { h: 'Sleep Research Reveals Why Eight Hours Isn\'t the Magic Number for Everyone', s: 'A large-scale study finds that optimal sleep duration varies significantly based on genetics, challenging one-size-fits-all health recommendations.', src: 'New Scientist' },
                { h: 'NHS Digital Health Push Shows Mixed Results in First Year Review', s: 'While app-based consultations have reduced GP wait times in some regions, concerns about digital exclusion persist among older patients.', src: 'BMJ' }
            ],
            'Sport': [
                { h: 'Data Analytics Revolution Is Reshaping Football Transfer Strategy', s: 'Clubs increasingly rely on algorithmic scouting to identify undervalued players, with mid-table teams closing the gap on traditional powerhouses.', src: 'The Athletic' },
                { h: 'Grassroots Funding Crisis: How Budget Cuts Are Affecting Youth Sport', s: 'Local councils report a 30% reduction in sports facility budgets, raising concerns about the long-term pipeline of athletic talent.', src: 'Sky Sports' }
            ],
            'Culture': [
                { h: 'The Bookshop Revival: Independent Stores Are Thriving Against the Odds', s: 'Community-focused bookshops have found a successful formula combining curated selections, events, and local partnerships to compete with online retailers.', src: 'The Observer' },
                { h: 'Museum Exhibition Challenges Visitors to Rethink the History of London', s: 'A new immersive exhibition uses augmented reality to overlay historical scenes onto present-day streetscapes, drawing record attendance.', src: 'Time Out London' }
            ],
            'Space': [
                { h: 'Private Mission Returns New Samples from the Lunar South Pole', s: 'The successful retrieval mission provides scientists with material that could confirm the presence of accessible water ice, a crucial step for future habitation.', src: 'NASA' },
                { h: 'UK Space Agency Announces Expanded Satellite Programme', s: 'A new investment in small satellite manufacturing aims to position Britain as a key player in the growing space economy.', src: 'The Telegraph' }
            ],
            'Crypto': [
                { h: 'Regulatory Clarity in Europe Drives Institutional Crypto Adoption', s: 'New MiCA regulations have created a framework that banks and asset managers are using to justify adding digital assets to their portfolios.', src: 'CoinDesk' },
                { h: 'Stablecoin Volumes Surpass Traditional Payment Rails in Emerging Markets', s: 'Cross-border remittance data shows blockchain-based payments overtaking conventional methods in several African and Southeast Asian corridors.', src: 'Financial Times' }
            ],
            'Gaming': [
                { h: 'Indie Game Developers Report Record Revenue on Open Platforms', s: 'New distribution models that offer better revenue splits are attracting smaller studios away from traditional storefronts, reshaping the industry landscape.', src: 'Eurogamer' },
                { h: 'Cloud Gaming Finally Delivers on Its Promise — But at What Cost?', s: 'Infrastructure improvements have solved latency issues, but subscription fatigue and data usage concerns may limit mainstream adoption.', src: 'Ars Technica' }
            ],
            'Music': [
                { h: 'Vinyl Revival Drives Innovation in Record Pressing Technology', s: 'Demand for physical music formats has pushed manufacturers to develop faster, more sustainable production methods using recycled materials.', src: 'Pitchfork' },
                { h: 'AI-Generated Music Sparks Licensing Debate Among Rights Holders', s: 'The music industry grapples with how to handle compositions created with AI assistance, with no clear consensus emerging.', src: 'Rolling Stone' }
            ],
            'Food': [
                { h: 'London\'s Street Food Scene Adapts as Market Rents Keep Rising', s: 'Vendors are forming collectives and exploring pop-up models to stay viable, while some have turned to direct delivery to bypass high pitch fees.', src: 'Eater London' },
                { h: 'The Fermentation Boom: How Home Cooks Are Embracing Live Cultures', s: 'Sales of fermentation equipment have tripled, driven by social media communities sharing techniques for making kimchi, miso, and kombucha at home.', src: 'Bon Appétit' }
            ]
        };

        function generateFeed() {
            if (selectedTopics.length === 0) return;

            generatedArticles = [];
            const times = ['2h ago', '3h ago', '4h ago', '5h ago', '6h ago', '8h ago', '10h ago', '12h ago'];
            let timeIdx = 0;

            selectedTopics.forEach(topic => {
                const templates = articleTemplates[topic] || [
                    { h: `Breaking Developments in ${topic} Space`, s: `New research and developments in ${topic} are reshaping how experts think about the field, with implications for both practitioners and the general public.`, src: 'Reuters' },
                    { h: `Why ${topic} Matters More Than Ever in 2026`, s: `Industry leaders weigh in on why this year could be a turning point, citing technological advances and shifting public attitudes as key drivers.`, src: 'The Guardian' }
                ];

                templates.forEach(t => {
                    generatedArticles.push({
                        id: Date.now() + Math.random(),
                        topic,
                        headline: t.h,
                        summary: t.s,
                        source: t.src,
                        time: times[timeIdx % times.length]
                    });
                    timeIdx++;
                });
            });

            // Shuffle
            generatedArticles.sort(() => Math.random() - 0.5);
            saveState();
            renderFeed();
        }

        function renderFeed() {
            const container = document.getElementById('feedContainer');

            if (generatedArticles.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <hr class="divider">
                <div class="section-header">Your Feed · ${generatedArticles.length} articles</div>
                <div class="article-list">
                    ${generatedArticles.map(a => `
                        <div class="article">
                            <div class="article-topic">${a.topic}</div>
                            <div class="article-headline" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">${a.headline}</div>
                            <div class="article-summary">${a.summary}</div>
                            <div class="article-meta">
                                <span class="article-source">${a.source}</span>
                                <span class="article-time">${a.time}</span>
                                <button class="save-btn ${savedArticles.some(s => s.headline === a.headline) ? 'saved' : ''}"
                                    onclick="toggleSave(this, '${a.headline.replace(/'/g, "\\'")}', '${a.topic}')">
                                    ${savedArticles.some(s => s.headline === a.headline) ? '★ Saved' : '☆ Save'}
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            renderSaved();
        }

        function toggleSave(btn, headline, topic) {
            const exists = savedArticles.findIndex(s => s.headline === headline);
            if (exists > -1) {
                savedArticles.splice(exists, 1);
            } else {
                savedArticles.push({ headline, topic, savedAt: new Date().toLocaleDateString() });
            }
            saveState();
            renderFeed();
        }

        function removeSaved(headline) {
            savedArticles = savedArticles.filter(s => s.headline !== headline);
            saveState();
            renderFeed();
        }

        function renderSaved() {
            const section = document.getElementById('savedSection');
            const list = document.getElementById('savedList');

            if (savedArticles.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            list.innerHTML = savedArticles.map(s => `
                <div class="saved-item">
                    <span class="saved-title">${s.headline}</span>
                    <button class="remove-btn" onclick="removeSaved('${s.headline.replace(/'/g, "\\'")}')">×</button>
                </div>
            `).join('');
        }

        // Init
        renderTopics();
        if (generatedArticles.length > 0) renderFeed();
    </script>
</body>
</html>
